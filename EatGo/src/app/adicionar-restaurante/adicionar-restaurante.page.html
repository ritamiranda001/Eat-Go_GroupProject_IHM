<!-- Cabeçalho da página -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <!-- Botão para voltar à página anterior -->
      <ion-button (click)="voltar()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Adicionar Restaurante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Mensagem de sucesso — aparece após submissão bem sucedida -->
  <div class="sucesso-banner" *ngIf="sucesso">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <span>Restaurante adicionado com sucesso! A redirecionar...</span>
  </div>

  <!-- Lista de erros de validação — aparece se houver erros no formulário -->
  <div class="erros-banner" *ngIf="erros.length > 0">
    <p *ngFor="let erro de erros">• {{ erro }}</p>
  </div>

  <!-- Formulário — oculto após submissão bem sucedida -->
  <div class="form-wrapper" *ngIf="!sucesso">

    <!-- Campo: Nome do restaurante (obrigatório) -->
    <div class="campo">
      <ion-label class="campo-label">Nome do restaurante *</ion-label>
      <ion-input
        [(ngModel)]="novoRestaurante.nome"
        placeholder="Ex: O Pescador"
        class="campo-input"
        fill="outline"
      ></ion-input>
    </div>

    <!-- Campo: Categoria (obrigatório) — lista gerada dinamicamente -->
    <div class="campo">
      <ion-label class="campo-label">Categoria *</ion-label>
      <ion-select
        [(ngModel)]="novoRestaurante.categoria"
        placeholder="Seleciona uma categoria"
        class="campo-input"
        fill="outline"
      >
        <!-- Opções geradas a partir do array de categorias no .ts -->
        <ion-select-option *ngFor="let cat of categorias" [value]="cat">
          {{ cat }}
        </ion-select-option>
      </ion-select>
    </div>

    <!-- Campo: Descrição (obrigatório) -->
    <div class="campo">
      <ion-label class="campo-label">Descrição *</ion-label>
      <ion-textarea
        [(ngModel)]="novoRestaurante.descricao"
        placeholder="Descreve o restaurante..."
        [rows]="3"
        class="campo-input"
        fill="outline"
      ></ion-textarea>
    </div>

    <!-- Campo: Localização (obrigatório) -->
    <div class="campo">
      <ion-label class="campo-label">Localização *</ion-label>
      <ion-input
        [(ngModel)]="novoRestaurante.localizacao"
        placeholder="Ex: Largo São Domingos, Viana do Castelo"
        class="campo-input"
        fill="outline"
      ></ion-input>
    </div>

    <!-- Campo: Nível de preço — botões $, $$, $$$ -->
    <div class="campo">
      <ion-label class="campo-label">Nível de preço</ion-label>
      <div class="preco-opcoes">
        <!-- Botão ativo (solid) quando corresponde ao nível selecionado -->
        <ion-button
          *ngFor="let p of ['$', '$$', '$$$']"
          [fill]="novoRestaurante.nivelPreco === p ? 'solid' : 'outline'"
          color="primary"
          (click)="selecionarPreco(p)"
        >{{ p }}</ion-button>
      </div>
    </div>

    <!-- Campo: Foto do restaurante — abre galeria do telemóvel -->
    <div class="campo">
      <ion-label class="campo-label">Foto do restaurante</ion-label>

      <!-- Área clicável para selecionar imagem da galeria -->
      <div class="imagem-selector" (click)="selecionarImagem()">
        <!-- Placeholder exibido quando nenhuma imagem foi selecionada -->
        <div *ngIf="!imagemPreview" class="imagem-placeholder">
          <ion-icon name="camera-outline"></ion-icon>
          <span>Toca para escolher uma foto da galeria</span>
        </div>
        <!-- Preview da imagem selecionada -->
        <img *ngIf="imagemPreview" [src]="imagemPreview" alt="Preview" class="imagem-preview-img"/>
      </div>

      <!-- Botão para alterar a foto — só aparece após selecionar uma imagem -->
      <ion-button *ngIf="imagemPreview" fill="outline" color="medium" expand="block" (click)="selecionarImagem()">
        <ion-icon slot="start" name="camera-outline"></ion-icon>
        Alterar foto
      </ion-button>
    </div>

    <!-- Botão para submeter o formulário -->
    <ion-button expand="block" color="primary" class="btn-submeter" (click)="submeter()">
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Adicionar Restaurante
    </ion-button>

  </div>

</ion-content>
